{% extends "base.html" %}
{% block content %}
<h2>Upload Monthly Excel</h2>
<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  <div class="mb-3">
    <input type="file" name="file" accept=".xlsx,.xls,.csv" required>
  </div>
  <button class="btn btn-success" type="submit">Upload & Process</button>
</form>
{% for m in messages %}
  <div class="alert alert-info mt-3">{{ m }}</div>
{% endfor %}
{% endblock %}
