{% extends "base.html" %}
{% block content %}

<div class="container">

<h2>Select Company & Bill</h2>

<form id="invoiceForm" onsubmit="return false;">

  <label class="form-label"><strong>Company</strong></label>
  <select id="companySelect" class="form-select" required>
    <option value="">-- Select --</option>
    {% for c in companies %}
      <option value="{{ c.id }}">{{ c.name }}</option>
    {% endfor %}
  </select>

  <div class="mt-3">
    <label class="form-label"><strong>Bill Name</strong></label>
    <select id="invoiceSelect" class="form-select">
      <option value="">-- Select Bill --</option>
      {% for inv in invoices %}
        <option value="{{ inv.id }}">{{ inv.name }}</option>
      {% endfor %}
    </select>
  </div>

  <button
    type="button"
    class="btn btn-primary mt-4 w-100"
    onclick="generateInvoice()"
  >
    Open Editable Invoice
  </button>
</form>

<script>
  function generateInvoice() {
    const companyId = document.getElementById("companySelect").value;
    const invoiceId = document.getElementById("invoiceSelect").value;

    if (!companyId && !invoiceId) {
      alert("Please select Company or Bill Name");
      return;
    }

    if (invoiceId) {
      window.location.href = `/billing/invoice/by-invoice/${invoiceId}/`;
      return;
    }

    alert("Month-based preview disabled. Please select Bill Name.");
  }
</script>
</div>
{% endblock %}
